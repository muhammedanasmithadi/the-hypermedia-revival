name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  html:
    name: HTML validation (vnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Validate shipped pages with vnu
        run: npx --yes vnu-jar index.html 404.html lessons/index.html
          lessons/0001-the-machine-that-prints-its-own-manual.html lessons/0002-how-the-idea-got-lost.html
          lessons/0003-two-architectures-on-the-same-table.html
          lessons/0004-the-status-line-names-what-happened.html
          lessons/0005-ask-without-harm-repeat-without-doubt.html glossary.html

  js:
    name: Inline script check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline scripts
        run: node scripts/check-js.mjs

  sitemap:
    name: Sitemap XML check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse sitemap.xml
        run: |
          python3 -c 'import xml.etree.ElementTree as ET; r = ET.parse("sitemap.xml").getroot(); u = r.findall("{http://www.sitemaps.org/schemas/sitemap/0.9}url"); assert u, "no urls"; print(f"sitemap OK: {len(u)} url entries")'

  consistency:
    name: Site consistency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify pages against manifest.json
        run: node scripts/check-consistency.mjs --ci